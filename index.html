// Ball, capsule-wall and flipper collision are adapted from Ten Minute Physics #04 "How to write a pinball
// simulation", Copyright 2021 Matthias Müller (MIT License, see SAMPLES.md):

//   flipper's surface velocity perp(r) * omega at the contact.
// Added here: a fixed 120 Hz tick with SUB substeps (about 1 kHz) so speed never depends on frame rate and a ball
// moves under a third of its radius per substep (no tunnelling); restitution with VPX-style elasticity falloff and
// Coulomb friction on every contact; tapered flippers with coil acceleration, end-of-stroke stop and a return spring;
// kicking bumpers and slingshots; one-way gates; switches, spinners, saucers; ramp layers with height profiles;
// a kinematic plunger; ball-ball contact for multiball; and a uniform grid broadphase.
//
// Units: millimetres, seconds. +x is right, +y is up the table (away from the player). Gravity pulls toward -y.

const SUB = 8;
const DT = TICK / SUB;
const BALL_R = 13.5;           // a 27 mm (1 1/16") pinball
const MAX_SPEED = 6500;        // mm/s; 6.8 mm per substep, half the ball radius
const G_TABLE = 1350;          // gravity along the playfield (about 7.9 degrees of pitch)
const G_RAMP = 9810;           // full gravity, applied along a ramp's own slope
const LAYER = { FIELD: 1, RAMP: 2, WIRE: 4 };

// segment kinds
const K = { WALL: 0, RUBBER: 1, SLING: 2, TARGET: 3, GATE: 4, DROP: 5, POST: 6, BUMPER: 7 };

const CELL = 48;

// ---------------------------------------------------------------------------------------------------------------
// World construction
// ---------------------------------------------------------------------------------------------------------------

/** Build a runtime world from a compiled table (see table.js). */
function createWorld(table) {
  const w = {
    table,
    time: 0,
    tick: 0,
    balls: [],
    nextBallId: 1,
    flippers: table.flippers.map((f) => ({ ...f, theta: 0, omega: 0, held: false })),
    plunger: { ...table.plunger, pull: 0, vel: 0, pos: 0, holding: false, auto: 0 },
    drops: new Uint8Array(table.segs.length),      // 1 = drop target is down (segment inactive)
    events: [],
    nudgeX: 0, nudgeY: 0,
    magnets: [],                                     // {x, y, r, strength, on}
    pending: [],                                     // timed inputs, see queueInput

// ---------------------------------------------------------------------------------------------------------------

function setFlipper(w, side, held) {

const TAP_PULL = 6;          // mm: a release before the plunger has drawn this far (~150 ms) is a tap
const TAP_STRENGTH = 0.85;   // a tap fires like a launch button, round the arch

/** Hold (true) to draw the plunger back, release (false) to fire. */
function setPlunger(w, holding) {

    lastMajor: { t: -10, side: '' }, combo: 0, switches: 0, searchAt: 0 };
  G.mode = null;
  G.mb = null;
  G.bonus = null;
}

// ------------------------------------------------------------------------------------------------- cues
function cue(G, c) { G.cues.push({ t: G.t, ...c }); }
function dmd(G, text, sub = '', ms = 1600, prio = 1, anim = null) { cue(G, { k: 'dmd', text, sub, ms, prio, anim }); G.callouts.push(text); if (G.callouts.length > 8) G.callouts.shift(); }
function sound(G, name, v = 1) { cue(G, { k: 'sound', name, v }); }
function show(G, name, ms = 1500) { G.lampShow = { name, until: G.t + ms / 1000 }; cue(G, { k: 'show', name, ms }); }
function score(G, n, where) {
  if (G.player.tilted || G.scene !== 'game') return 0;
  G.player.score += n;
  cue(G, { k: 'score', n, where });
  return n;
}
function after(G, secs, fn) { G.timers.push({ at: G.t + secs, fn }); }

// ------------------------------------------------------------------------------------------------- game flow
function newGame(G, { balls = G.settings.balls, practice = G.settings.practice, seed } = {}) {
  if (seed != null) { G.rng = makeRng(seed); G.seedValue = seed; }
  G.settings.balls = balls; G.settings.practice = practice;
  G.w = createWorld(G.T);
  G.timers = []; G.cues.length = 0;
  resetPlayer(G);
  G.scene = 'game';
  dmd(G, 'SPA CITY', 'BALL 1', 1800, 2);
  sound(G, 'start');
  serve(G);
}

function serve(G) {
  G.w.dead = false;
  G.player.tilted = false; G.player.warnings = 0; G.player.bob = 0;
  const b = addBall(G.w, SHOOTER.x, SHOOTER.y);
  G.ball.inLane = true; G.ball.launched = false; G.ball.switches = 0;
  G.ball.skillLane = G.rng.int(3);
  G.ball.saveUntil = 0; G.ball.saving = false;
  cue(G, { k: 'serve', ball: b.id });
  return b;
}

function ballsInPlay(G) { return G.w.balls.filter((b) => !(b.held && b.held.drained)).length; }

function startBallSave(G, secs) { G.ball.saveUntil = Math.max(G.ball.saveUntil, G.t + secs); }

const inShooter = (b) => !b.held && b.x > 480 && b.y < 160;
function autoLaunch(G, delay = 0.7, strength = 0.82) {
  // a new ball into the shooter lane, plunged for the player (saves, locks, multiball); waits while the lane is busy
  if (G.w.balls.some(inShooter)) {
    // the lane is busy: plunge whatever is resting there, then feed this ball
    if (G.w.plunger.vel === 0 && !G.w.plunger.holding && G.w.balls.some((b) => inShooter(b) && b.still > 0.3)) autoPlunge(G.w, strength);
    after(G, 0.8, () => autoLaunch(G, delay, strength));
    return null;
  }
  const b = addBall(G.w, SHOOTER.x, SHOOTER.y);
  after(G, delay, () => { autoPlunge(G.w, strength); sound(G, 'plunger'); });
  return b;
}

function onDrain(G, ballId) {
  const b = G.w.balls.find((q) => q.id === ballId);
  if (b) removeBall(G.w, b);
  sound(G, 'drain');
  const left = ballsInPlay(G);
  if (G.t < G.ball.saveUntil && !G.player.tilted || (G.settings.practice && left === 0)) {
    dmd(G, 'BALL SAVED', '', 1400, 3); sound(G, 'save'); cue(G, { k: 'slowmo', ms: 500 });
    autoLaunch(G, 0.9);
    return;
  }
  if (left >= 2) return;
  if (left === 1) { if (G.mb) endMultiball(G); return; }
  // last ball gone
  if (G.mb) endMultiball(G);
  endBall(G);
}

function endBall(G) {
  if (G.mode) endMode(G, false);
  const f = G.f, p = G.player;
  const parts = [
    ['BATHHOUSES', f.row.reduce((a, b) => a + b, 0) * 2000 + f.rowsDone * 16000],
    ['TOWER', f.towerLevel * 10000],
    ['MODES', f.modesPlayed.reduce((a, b) => a + b, 0) * 15000],
    ['SPINS', f.spins * 10],
  ];
  const sub = parts.reduce((a, [, v]) => a + v, 0);
  const total = p.tilted ? 0 : sub * p.bonusX;
  G.bonus = { parts, x: p.bonusX, total, until: G.t + 2.6, tilted: p.tilted };
  G.scene = 'bonus';
  if (!p.tilted) p.score += total;
  cue(G, { k: 'bonus', ...G.bonus });
  sound(G, 'bonus');
  f.spins = 0;
  after(G, 2.6, () => nextBall(G));
}

function nextBall(G) {
  G.bonus = null;
  const p = G.player;
  p.bonusX = 1;
  if (p.extraBalls > 0) {
    p.extraBalls--;
    G.scene = 'game';
    dmd(G, 'SHOOT AGAIN', 'SAME PLAYER', 1800, 3); sound(G, 'shootAgain');
    serve(G);
    return;
  }
  if (p.ball >= p.ballsPerGame) { gameOver(G); return; }
  p.ball++;
  G.scene = 'game';
  dmd(G, 'BALL ' + p.ball, fmt(p.score), 1600, 2);
  serve(G);
}

function gameOver(G) {
  G.scene = 'over';
  const p = G.player;
  p.match = G.rng.int(10) * 10;
  const won = (p.score % 100) === p.match;
  cue(G, { k: 'over', score: p.score, match: p.match, won });
  dmd(G, 'GAME OVER', fmt(p.score), 2500, 3);
  sound(G, 'gameOver');
  show(G, 'attract', 3000);
}

// ------------------------------------------------------------------------------------------------- per tick
/** Advance the whole game one fixed tick: physics, then rules on its events. */
function tick(G) {
  step(G.w);
  G.t = G.w.time;
  const evs = G.w.events.splice(0);
  for (const e of evs) handle(G, e);
  // timers
  if (G.timers.length) {
    const due = G.timers.filter((q) => q.at <= G.t);
    if (due.length) { G.timers = G.timers.filter((q) => q.at > G.t); for (const q of due) q.fn(); }
  }
  if (G.scene === 'game') perTick(G);
}

function perTick(G) {
  const p = G.player, f = G.f;
  p.bob = Math.max(0, p.bob - 1.2 * TICK);
  if (f.boilUntil && G.t > f.boilUntil) { f.boilUntil = 0; f.springTemp = 120; dmd(G, 'SPRINGS COOL TO 120°F', '', 1200); }
  if (G.mode) tickMode(G);
  if (G.mb) tickMultiball(G);
  if (G.lampShow && G.t > G.lampShow.until) G.lampShow = null;
  // a tilted table plunges any ball left resting in the shooter lane, so every ball can drain
  if (p.tilted && G.w.plunger.vel === 0 && !G.w.plunger.holding && G.w.balls.some((b) => inShooter(b) && b.still > 0.5)) autoPlunge(G.w, 0.85);
  // ball search: everything still for 5 s outside a saucer or the shooter lane
  const free = G.w.balls.filter((b) => !b.held);
  // (a held flipper means the player is cradling: never search then)
  if (free.length && !G.w.flippers.some((q) => q.held) && free.every((b) => b.still > 5 && !(b.x > 480 && b.y < 140))) {
    if (G.t > G.ball.searchAt) {
      G.ball.searchAt = G.t + 2;
      cue(G, { k: 'search', at: free.map((b) => [Math.round(b.x), Math.round(b.y), b.layer]) });
      for (const b of free) { b.vx += (G.rng.next() - 0.5) * 900; b.vy += 500 + G.rng.next() * 400; b.still = 0; }
    }
  }
}

// ------------------------------------------------------------------------------------------------- events
function handle(G, e) {
  if (e.t === 'drain') { G.lastDrainX = e.x; if (G.scene === 'game' || G.scene === 'bonus') onDrain(G, e.ball); return; }
  if (e.t === 'flipEnd' || e.t === 'plungerHit') { sound(G, e.t === 'flipEnd' ? 'flipStop' : 'plungerHit'); return; }
  if (e.t === 'wall') { sound(G, 'wall', Math.min(1, e.speed / 2500)); return; }
  if (e.t === 'clack') { sound(G, 'clack', Math.min(1, e.speed / 2000)); return; }
  if (e.t === 'flipHit') { sound(G, 'flipHit', Math.min(1, e.speed / 3000)); return; }
  if (e.t === 'offRamp') return;
  const name = G.T.swName[e.sw];
  if (!name) return;
  if (G.scene !== 'game') { sound(G, e.t === 'bumper' ? 'bumper' : e.t === 'sling' ? 'sling' : 'switch'); return; }
  if (name !== 'shooterLane') G.ball.switches++;
  sw(G, name, e);
}

function sw(G, name, e) {
  const f = G.f, p = G.player;
  if (p.tilted) {
    // a tilted table scores nothing, but saucers still throw the ball back so it can drain
    if (e.t === 'hole') { const h = G.T.holes.find((q) => q.sw === e.sw); holdThen(G, e.ball, 0.5, h.kickAngle, h.kickSpeed); }
    return;
  }
  // shooter lane exit starts ball save and the skill-shot window
  if (name === 'shooterLane') {
    if (e.dir > 0 && G.ball.inLane) {
      G.ball.inLane = false; G.ball.launched = true;
      if (!G.ball.saveUntil || G.ball.saveUntil < G.t) startBallSave(G, G.mb ? 15 : 10);
      G.ball.skillUntil = G.t + 4;
      sound(G, 'launch');
    }
    return;
  }
  if (name.startsWith('lane')) return lane(G, 'SPA'.indexOf(name[4]));
  if (name.startsWith('bumper')) return bumper(G, +name[6] - 1, e);
  if (name.startsWith('sling')) { score(G, 110); sound(G, 'sling'); cue(G, { k: 'flash', name: name }); return; }
  if (name === 'inL' || name === 'inR') { score(G, 1000); sound(G, 'rollover'); return; }
  if (name === 'outL' || name === 'outR') { score(G, 5000); sound(G, 'outlane'); dmd(G, 'OUTLANE', '5,000', 900); return; }
  if (name.startsWith('bh')) return bathhouse(G, BATHHOUSES.indexOf(name.slice(2)), e);
  if (name === 'spinner') return spinner(G, e);
  if (name === 'orbitTop') return major(G, 'orbitTop');
  if (name === 'reserve') return major(G, 'reserve');
  if (name === 'rampEnter') { sound(G, 'rampEnter'); return; }
  if (name === 'rampMade') return major(G, 'rampMade');
  if (name === 'wireDrop') { sound(G, 'wireDrop'); return; }
  if (name === 'vapors') return vapors(G, e);
  if (name === 'lock') return lockHole(G, e);
  if (name === 'vaporsEnter' || name === 'lockEnter' || name === 'orbitDown') { sound(G, 'switch'); return; }
}

function lane(G, i) {
  const f = G.f;
  sound(G, 'rollover');
  score(G, 1000);
  if (G.ball.skillUntil > G.t && i === G.ball.skillLane) {
    G.ball.skillUntil = 0;
    G.player.skillShots++;
    const v = Math.min(100000, 25000 * G.player.skillShots);
    score(G, v);
    dmd(G, 'SKILL SHOT', fmt(v), 2000, 3, 'skill'); sound(G, 'skill'); show(G, 'skill', 1200);
  }
  G.ball.skillUntil = 0;
  f.spa[i] = 1;
  if (f.spa.every(Boolean)) {
    f.spa = [0, 0, 0];
    if (G.player.bonusX < 5) G.player.bonusX++;
    dmd(G, 'S·P·A COMPLETE', 'BONUS ' + G.player.bonusX + 'X', 1600, 2); sound(G, 'spa'); show(G, 'spa', 900);
  }
}

/** Flipper buttons rotate the lit top lanes (and the skill-shot lane while the ball is in the shooter lane). */
function laneChange(G, dir) {
  const a = G.f.spa;
  G.f.spa = dir > 0 ? [a[2], a[0], a[1]] : [a[1], a[2], a[0]];
  if (G.ball.inLane) G.ball.skillLane = (G.ball.skillLane + (dir > 0 ? 1 : 2)) % 3;
}

function bumper(G, i, e) {
  const f = G.f;
  if (f.springTemp < 143) f.springTemp++;
  const boil = f.boilUntil > G.t;
  score(G, (500 + 10 * f.springTemp) * (boil ? 2 : 1));
  sound(G, 'bumper', 1); cue(G, { k: 'flash', name: 'bumper' + (i + 1) }); cue(G, { k: 'steam', i });
  if (f.springTemp >= 143 && !boil) {
    f.boilUntil = G.t + 30;
    dmd(G, 'THE SPRINGS BOIL', fact('temp'), 2200, 2, 'boil'); sound(G, 'boil'); show(G, 'boil', 1500);
  } else if (f.springTemp % 10 === 0 && f.springTemp < 143) {
    dmd(G, SPRINGS[i], f.springTemp + '°F', 700, 0);
  }
}

function bathhouse(G, i, e) {
  const f = G.f, name = BATHHOUSES[i];
  sound(G, 'target'); cue(G, { k: 'flash', name: 'bh' + name });
  if (G.mb && G.mb.kind === 'soak') {
    const v = score(G, 20000 * Math.max(1, ballsInPlay(G)));
    G.mb.hit[i] = 1;
    dmd(G, 'JACKPOT: ' + name.toUpperCase(), fmt(v), 1200, 2); sound(G, 'jackpot');
    if (G.mb.hit.every(Boolean) && !G.mb.superLit) { G.mb.superLit = true; dmd(G, 'SUPER JACKPOT LIT', 'SHOOT THE VAPORS', 1800, 3); }
    return;
  }
  if (G.mode) modeEvent(G, 'bh', i);
  if (!f.row[i]) {
    f.row[i] = 1;
    score(G, 3000);
    dmd(G, name.toUpperCase(), fact('bh' + name), 1500, 1);
    if (f.row.every(Boolean)) {
      f.rowsDone++;
      f.row = new Array(8).fill(0);
      f.grandSoakLit = true;
      dmd(G, 'BATHHOUSE ROW COMPLETE', 'GRAND SOAK AT THE VAPORS', 2400, 3, 'row'); sound(G, 'complete'); show(G, 'row', 1600);
    }
  } else score(G, 500);
}

function spinner(G, e) {
  const f = G.f;
  const spins = Math.max(1, Math.min(40, Math.round(e.speed / 70)));
  f.spins += spins; f.fifth += spins;
  score(G, 100 * spins);
  cue(G, { k: 'spin', n: spins, dir: e.dir });
  sound(G, 'spinner', Math.min(1, spins / 20));
  if (G.mode && G.mode.id === 'coaster') modeEvent(G, 'spin', spins);
  if (f.fifth >= 300 && !f.ebLit) { f.fifth = 0; f.ebLit = true; dmd(G, 'FIFTH SEASON', 'EXTRA BALL IS LIT', 2000, 3); sound(G, 'ebLit'); }
}

function major(G, name) {
  const f = G.f, side = MAJOR[name];
  // combos: another major shot within 3 s
  const last = G.ball.lastMajor;
  if (G.t - last.t < 3) {
    G.ball.combo++;
    const v = score(G, 20000 * G.ball.combo);
    dmd(G, (G.ball.combo + 1) + '-WAY COMBO', fmt(v), 1100, 2); sound(G, 'combo');
  } else G.ball.combo = 0;
  G.ball.lastMajor = { t: G.t, side };
  if (name === 'rampMade') {
    f.ramps++;
    score(G, 10000 + 5000 * f.towerLevel);
    sound(G, 'rampMade');
    if (G.mb && G.mb.kind === 'arlington' && G.mb.jackpotLit) {
      const v = score(G, G.mb.jackpot); G.mb.jackpot += 25000; G.mb.jackpotLit = false;
      dmd(G, 'JACKPOT', fmt(v), 1800, 3, 'jackpot'); sound(G, 'jackpot'); show(G, 'jackpot', 1000);
    } else if (f.ramps % 3 === 0) {
      f.towerLevel = Math.min(3, f.towerLevel + 1);
      if (!G.mb) f.lockLit = true;
      const t = ['woolman', 'rix', 'tower'][Math.min(2, f.towerLevel - 1)];
      dmd(G, 'TOWER LEVEL ' + f.towerLevel, fact(t), 2000, 2, 'tower');
      if (!G.mb) after(G, 2.1, () => dmd(G, 'LOCK IS LIT', 'SHOOT THE ARLINGTON', 1500, 2));
      sound(G, 'towerUp');
    } else if (!G.mode) dmd(G, 'MOUNTAIN TOWER', (3 - (f.ramps % 3)) + ' MORE FOR NEXT LEVEL', 1100, 1);
  } else if (name === 'orbitTop') {
    f.orbits++;
    score(G, 7500); sound(G, 'orbit');
    if (G.mb && G.mb.kind === 'arlington' && !G.mb.jackpotLit) { G.mb.jackpotLit = true; dmd(G, 'JACKPOT IS LIT', 'SHOOT THE RAMP', 1200, 2); }
    else if (!G.mode && f.orbits % 4 === 1) dmd(G, 'CENTRAL AVENUE', fact(G.rng.pick(['scotch', 'fifth', 'oaklawn'])), 1600, 1);
  } else if (name === 'reserve') {
    score(G, 5000); sound(G, 'orbit');
    if (G.mb && G.mb.kind === 'arlington' && !G.mb.jackpotLit) { G.mb.jackpotLit = true; dmd(G, 'JACKPOT IS LIT', 'SHOOT THE RAMP', 1200, 2); }
  }
  if (G.mode) modeEvent(G, name);
  if (G.mb && G.mb.kind === 'valley') valleyShot(G, name);
}

// ------------------------------------------------------------------------------------------------- saucers
function holdThen(G, ballId, secs, angle, speed, after2) {
  after(G, secs, () => {
    const b = G.w.balls.find((q) => q.id === ballId);
    if (b && b.held) { kickOut(G.w, b, angle, speed); sound(G, 'kick'); cue(G, { k: 'flash', name: 'kick' }); }
    if (after2) after2();
  });
}

function vapors(G, e) {
  const f = G.f, h = G.T.holes.find((q) => q.name === 'vapors');
  sound(G, 'saucer');
  score(G, 5000);
  const kick = (secs) => holdThen(G, e.ball, secs, h.kickAngle, h.kickSpeed);
  // priorities: super jackpot, raid hurry-up, wizard, grand soak, extra ball, mode start, mystery
  if (G.mb && G.mb.kind === 'soak' && G.mb.superLit) {
    const v = score(G, 250000); G.mb.superLit = false; G.mb.hit = new Array(8).fill(0);
    dmd(G, 'SUPER JACKPOT', fmt(v), 2500, 3, 'jackpot'); sound(G, 'superJackpot'); show(G, 'jackpot', 2000); return kick(1.6);
  }
  if (G.mb && G.mb.kind === 'valley') { valleyShot(G, 'vapors'); return kick(1.0); }
  if (G.mode && G.mode.id === 'raid' && G.mode.phase === 2) { modeEvent(G, 'vapors'); return kick(1.6); }
  if (f.wizardLit && !G.mb) { startValley(G); return kick(2.4); }
  if (f.grandSoakLit && !G.mb) { startGrandSoak(G); return kick(2.0); }
  if (f.ebLit) {
    f.ebLit = false; G.player.extraBalls++; G.player.eb++;
    dmd(G, 'EXTRA BALL', '', 2200, 3, 'eb'); sound(G, 'extraBall'); show(G, 'eb', 1500); return kick(2.0);
  }
  if (!G.mode && !G.mb) { startMode(G); return kick(2.2); }
  mystery(G);
  kick(1.8);
}

function mystery(G, forced) {
  const total = MYSTERY.reduce((a, m) => a + m.w, 0);
  let m = forced ? MYSTERY.find((q) => q.id === forced) : null;
  if (!m) { let r = G.rng.next() * total; m = MYSTERY.find((q) => (r -= q.w) < 0) || MYSTERY[0]; }
  const reels = [G.rng.pick(REEL), G.rng.pick(REEL), G.rng.pick(REEL)];
  const f = G.f;
  switch (m.id) {
    case 'pts10': score(G, 10000); break;
    case 'pts25': score(G, 25000); break;
    case 'lock': if (!G.mb) f.lockLit = true; break;
    case 'heat': f.springTemp = Math.min(143, f.springTemp + 10); break;
    case 'tower': f.ramps++; if (f.ramps % 3 === 0) { f.towerLevel = Math.min(3, f.towerLevel + 1); if (!G.mb) f.lockLit = true; } break;
    case 'save': startBallSave(G, 15); break;
    case 'bonusx': if (G.player.bonusX < 5) G.player.bonusX++; break;
    case 'eb': f.ebLit = true; break;
  }
  dmd(G, 'THE VAPORS', m.label, 1700, 2, { kind: 'reels', reels });
  sound(G, 'reels');
  return m.id;
}

function lockHole(G, e) {
  const f = G.f, h = G.T.holes.find((q) => q.name === 'lock');
  sound(G, 'saucer');
  if (G.mode) modeEvent(G, 'lock');
  if (f.lockLit && !G.mb) {
    f.locks++; f.lockLit = false;
    const b = G.w.balls.find((q) => q.id === e.ball);
    if (f.locks >= 3) { f.locks = 0; startArlington(G, e.ball); return; }
    score(G, 15000);
    dmd(G, 'BALL ' + f.locks + ' LOCKED', f.locks === 1 ? fact('arlington') : fact('capone'), 2000, 2, 'lock'); sound(G, 'lock');
    if (b) removeBall(G.w, b);
    if (ballsInPlay(G) === 0) autoLaunch(G, 1.2);
    return;
  }
  score(G, 2500);
  holdThen(G, e.ball, 0.6, h.kickAngle, h.kickSpeed);
}

// ------------------------------------------------------------------------------------------------- modes
function startMode(G, forceIdx) {
  const f = G.f;
  let i = forceIdx ?? f.nextMode;
  if (forceIdx == null) { for (let k = 0; k < 6 && f.modesPlayed[i]; k++) i = (i + 1) % 6; }
  const M = MODES[i];
  G.mode = { i, id: M.id, t0: G.t + 2.2, end: G.t + 2.2 + M.dur, progress: 0, need: 0, phase: 1, lit: [], data: {} };
  const m = G.mode;
  if (M.id === 'soak') { m.need = 6; m.lit = [G.rng.int(8)]; m.data.nextMove = m.t0 + 3; }
  if (M.id === 'derby') { m.need = 100; m.data.horses = [0, 0, 0, 0]; m.data.names = ['YOU', 'SODA POP', 'MISS VAPOR', 'RED TILE']; }
  if (M.id === 'raid') { m.need = 3; m.lit = pickN(G, 8, 3); m.data.value = 200000; }
  if (M.id === 'tower') m.need = 3;
  if (M.id === 'tub') { m.need = 5; m.data.want = ''; }
  if (M.id === 'coaster') { m.need = 4; m.data.spins = 0; }
  f.nextMode = (i + 1) % 6;
  dmd(G, M.name, M.cue, 2200, 3, { kind: 'mode', id: M.id }); sound(G, 'modeStart'); show(G, 'mode', 1800);
  cue(G, { k: 'mode', id: M.id, on: true });
}

function pickN(G, n, k) { const a = [...Array(n).keys()]; const out = []; while (out.length < k) out.push(a.splice(G.rng.int(a.length), 1)[0]); return out; }

function modeEvent(G, kind, arg) {
  const m = G.mode;
  if (!m || G.t < m.t0) return;
  const M = MODES[m.i];
  if (M.id === 'soak' && kind === 'bh' && m.lit.includes(arg)) {
    m.progress++; G.f.bathsTotal++;
    score(G, 15000);

let renderClock = null, clockBase = 0, view = null, view2d = null, loading = true, frameNo = 0, lastFact = 0, overTimer = 0;
const prev = new Map();
let lastDots = null, lastDmdW = 0;
const uiCache = {};
const touchChip = () => matchMedia('(max-aspect-ratio: 4 / 5)').matches;   // the phone-portrait score plate
const setText = (sel, v) => { if (uiCache[sel] !== v) { uiCache[sel] = v; $(sel).textContent = v; } };
const dmd = new DMD();
const effects = [];   // flashes, steam, shake → the view

// ------------------------------------------------------------------------------------------------- views
const canvasGL = $('#gl'), canvas2D = $('#c2d'), tableEl = $('#table');
function reducedMotion() { return app.settings.motion === 'reduced' || (app.settings.motion === 'auto' && matchMedia('(prefers-reduced-motion: reduce)').matches); }

function loadScript(src) { return new Promise((res) => { const s = document.createElement('script'); s.src = src; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); }); }

async function initView() {
  view2d = createView2D(canvas2D, T, LAMPS);
  const want = qs.get('tier') || app.settings.tier;
  if (want !== '2d' && !window.THREE) await loadScript('vendor/three-r186.min.js');
  if (want !== '2d' && probeGL()) {
    try { view = await createView3D(canvasGL, T, LAMPS, { tier: want, reducedMotion }); } catch (e) { console.error('3D view failed, using 2D', e); view = null; }   // an error, so tests catch it
  }
  if (!view) view = view2d;
  // the governor's last step: software GL still too slow at Low → the flat 2D table
  if (view.kind === '3d') view.onTooSlow = () => { if (app.settings.tier === 'auto') { view.hide(); view = view2d; document.body.dataset.view = '2d'; } };
  document.body.dataset.view = view.kind;
  resize();
}

function resize() {
  if (!view2d) return;
  const r = tableEl.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, view && view.kind === '3d' ? view.maxRatio() : 2);
  if (view && view.kind === '3d') view.resize(r.width, r.height, ratio);
  view2d.resize(r.width, r.height, Math.min(window.devicePixelRatio || 1, 2));
  sizeDMD();
}
window.addEventListener('resize', resize);

const dmdCanvas = $('#dmd'), dmdCtx = dmdCanvas.getContext('2d');
function sizeDMD() {
  const r = dmdCanvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  dmdCanvas.width = Math.max(128, Math.round(r.width * d)); dmdCanvas.height = Math.max(32, Math.round(r.height * d));
}

// ------------------------------------------------------------------------------------------------- game control
function startDemo() {
  demo = true;
  G = createGame(T, { seed: TEST ? 3 : (Date.now() & 0xffff) });
  newGame(G, { balls: 3, practice: true });
  bot = createBot(G, { skill: 0.9, seed: 11 });
  G.cues.length = 0;
  document.body.dataset.scene = 'title';
  startMusic('title');
}

app.start = () => {
  unlock();
  demo = false; bot = null; paused = false;
  G = createGame(T, { seed: TEST ? 1 : (Date.now() & 0xffffff) });
  newGame(G, { balls: app.settings.balls, practice: app.settings.practice });
  dmd.queue.length = 0; dmd.cur = null;   // a new game starts with a clean display
  screens.close();
  document.body.dataset.scene = 'game';
  startMusic('main');
  clearTimeout(overTimer);
  tableEl.focus({ preventScroll: true });
};
app.resume = () => { paused = false; screens.close(); document.body.dataset.scene = demo ? 'title' : 'game'; lastNow = performance.now(); };
app.quit = () => { paused = false; screens.title(); startDemo(); };
app.applySettings = (s) => {
  const tierChanged = s.tier && s.tier !== app.settings.tier;
  Object.assign(app.settings, s);
  saveSettings(app.settings);
  setVolumes({ sound: app.settings.sound, music: app.settings.music, volume: app.settings.volume });
  document.documentElement.style.setProperty('--text-scale', app.settings.textScale);
  document.body.classList.toggle('reduced', reducedMotion());
  if (tierChanged && view && view.kind === '3d') { if (s.tier === '2d') { view.hide(); view = view2d; } else view.setTier(s.tier); }
  else if (tierChanged && view === view2d && s.tier !== '2d') initView();
  document.body.dataset.view = view ? view.kind : '2d';
};
function pause() {
  if (demo || paused) return;
  paused = true;
  // keys released while paused never reach the game, so let go of everything now
  G.w.pending.length = 0;   // a flip queued for a later substep must not fire after the release
  flipper(G, 'L', false); flipper(G, 'R', false); plunger(G, false);
  screens.pause(); document.body.dataset.scene = 'pause';
}

// ------------------------------------------------------------------------------------------------- input
// The sim time an input event belongs to. The offset is capped like a frame's step (MAX_DT), so an event never lands
// past the end of the frame that will run it.
function simTimeFor(ts) {
  const now = G.w.tick * TICK;
  const t = now + acc + Math.min(MAX_DT, Math.max(0, (ts - lastNow) / 1000)) * timeScale;
  return Math.max(now, t);
}
const input = createInput(tableEl, {
  wantsKeys(a) { return !screens.current || screens.current === 'entry' || a === 'pause'; },
  touchActive() { return !screens.current && !paused; },
  action(a, down, ts, src) {
    unlock();
    if (screens.current === 'entry') { if (down && screens.entryKey) screens.entryKey(a); return; }
    if (a === 'pause') {
      if (!down) return;
      if (screens.current === 'pause') app.resume();
      else if (paused) screens.pause();              // Esc backs out of settings or help to the pause menu
      else if (screens.current && demo) screens.title();
      else if (!demo) pause();
      return;
    }
    if (paused || demo || screens.current) return;
    if (a === 'flipL' || a === 'flipR') flipper(G, a === 'flipL' ? 'L' : 'R', down, simTimeFor(ts));
    else if (a === 'plunge') plunger(G, down);
    else if (down && a.startsWith('nudge')) { nudge(G, { nudgeL: 'left', nudgeR: 'right', nudgeU: 'up' }[a]); if (!reducedMotion()) effects.push({ k: 'shake', dir: a, t: now() }); }
  },
});
// on-screen buttons
$('#b-launch').addEventListener('pointerdown', (e) => { unlock(); if (!demo && !paused) plunger(G, true); e.preventDefault(); });
const releaseLaunch = (e) => { if (!demo && !paused) plunger(G, false); };
$('#b-launch').addEventListener('pointerup', releaseLaunch);
$('#b-launch').addEventListener('pointerleave', releaseLaunch);
$('#b-menu').addEventListener('click', () => { unlock(); if (demo) screens.title(); else pause(); });

const screens = createScreens($('#screens'), app);

// ------------------------------------------------------------------------------------------------- cues
function now() { return renderClock != null ? renderClock : (performance.now() - clockBase) / 1000; }

function routeCues() {
  for (const c of G.cues) {
    switch (c.k) {
      case 'dmd': if (!demo || c.prio >= 3) dmd.push(c); if (!demo) announce(c.text + (c.sub ? '. ' + c.sub : '')); break;
      case 'sound': if (!demo) sfx(c.name, c.v); break;
      case 'flash': case 'steam': case 'spin': case 'kick': effects.push({ ...c, t: now() }); break;
      case 'slowmo': if (!reducedMotion() && !TEST) { timeScale = 0.35; slowUntil = performance.now() + 500; } break;
      case 'mode': if (!demo) startMusic(G.mb ? 'multiball' : c.on ? 'mode' : 'main'); break;
      case 'mb': if (!demo) startMusic(c.on ? 'multiball' : (G.mode ? 'mode' : 'main')); break;
      case 'over': if (!demo) gameOverFlow(c); else setTimeout(() => demo && startDemo(), 1500); break;
      case 'tilt': effects.push({ k: 'tilt', t: now() }); break;
    }
  }
  G.cues.length = 0;
}

function gameOverFlow(c) {
  startMusic('title');
  overTimer = setTimeout(() => {
    if (qualifies(c.score)) screens.entry(c.score, (ini) => { const i = addScore(ini, c.score); screens.scores('over', i); });
    else screens.over(c.score, c.match, c.won);
  }, TEST ? 50 : 2600);
}

const live = $('#live');
let lastAnnounce = 0;
function announce(text) { const t = performance.now(); if (t - lastAnnounce < 900) return; lastAnnounce = t; live.textContent = text; }

// ------------------------------------------------------------------------------------------------- DMD base screen
function dmdBase(d) {
  if (demo) {
    const k = Math.floor(now() / 4) % (ATTRACT_FACTS.length + 2);
    if (k === 0) { d.center('SPA CITY', 2, 2, 3); d.center('PRESS START', 22, 1, Math.floor(now() * 2) % 2 ? 3 : 1); return; }
    if (k === 1) { const s = loadScores()[0]; d.center('HIGH SCORE', 3, 1, 2); d.center(s.initials + ' ' + fmt(s.score), 14, 1, 3); return; }
    const lines = DMD.wrap(FACTS[ATTRACT_FACTS[k - 2]].text, 21);
    lines.forEach((l, i) => d.center(l, 16 - lines.length * 4 + i * 9, 1, 3));
    return;
  }
  if (G.scene === 'bonus' && G.bonus) {
    const b = G.bonus, age = G.t - (b.until - 2.6);
    const idx = Math.min(b.parts.length, Math.floor(age / 0.45));
    if (b.tilted) { d.center('TILT', 4, 2, 3); d.center('NO BONUS', 22, 1, 2); return; }
    if (idx < b.parts.length) { d.center(b.parts[idx][0], 4, 1, 2); d.center(fmt(b.parts[idx][1]), 15, 2, 3); }
    else { d.center('BONUS ' + b.x + 'X', 3, 1, 2); d.center(fmt(b.total), 15, 2, 3); }
    return;
  }
  const p = G.player, s = fmt(p.score);
  d.center(s, 3, s.length <= 10 ? 2 : 1, 3);
  let line = 'BALL ' + p.ball + (p.extraBalls ? ' · EB' : '');
  if (G.mode) line = G.mode.id.toUpperCase() + ' ' + Math.max(0, Math.ceil(G.mode.end - G.t)) + 's · ' + (G.mode.progress | 0) + '/' + G.mode.need;
  else if (G.mb) line = { arlington: 'ARLINGTON MULTIBALL', soak: 'GRAND SOAK', valley: 'VALLEY OF THE VAPORS' }[G.mb.kind];
  else if (G.ball.inLane) line = 'SKILL SHOT: LANE ' + 'SPA'[G.ball.skillLane];
  d.center(line, 23, 1, 2);
}

// ------------------------------------------------------------------------------------------------- loop
function capturePrev() {
  for (const b of G.w.balls) prev.set(b.id, [b.x, b.y, b.z]);
  prev.set('fl', G.w.flippers.map((f) => f.angle));
}
function interpolated(alpha) {
  const pf = prev.get('fl');
  return {
    balls: G.w.balls.filter((b) => !(b.held && b.held.drained)).map((b) => {
      const q = prev.get(b.id) || [b.x, b.y, b.z];
      return { id: b.id, x: q[0] + (b.x - q[0]) * alpha, y: q[1] + (b.y - q[1]) * alpha, z: q[2] + (b.z - q[2]) * alpha, layer: b.layer, roll: b.roll, vx: b.vx, vy: b.vy };
    }),
    flippers: G.w.flippers.map((f, i) => ({ ...f, angle: pf ? pf[i] + (f.angle - pf[i]) * alpha : f.angle })),
  };
}

function frame(ts) {
  requestAnimationFrame(frame);
  frameNo++;
  input.pollPad(ts);
  let dt = Math.min(MAX_DT, (ts - lastNow) / 1000);
  lastNow = ts;
  if (slowUntil && ts > slowUntil) { timeScale = 1; slowUntil = 0; }
  if (!paused && !(TEST && window.__game.paused)) {
    acc += dt * timeScale;
    let n = 0;
    while (acc >= TICK && n < 24) { capturePrev(); if (bot) bot(); tick(G); routeCues(); acc -= TICK; n++; }
    if (n >= 24) acc = 0;
  }
  render(Math.min(1, acc / TICK));
}

function render(alpha) {
  const t = now();
  const lampOn = lampStates(G, LAMPS, t);
  const interp = interpolated(alpha);
  if (view) view.draw(G, alpha, lampOn, interp, { t, effects, demo, reduced: reducedMotion(), debug: qs.get('debug') === 'physics' });
  while (effects.length && t - effects[0].t > 2) effects.shift();
  dmd.frame(t * 1000, dmdBase);
  // repaint the dot canvas only when a dot changed (4,096 dots is real work on a phone)
  if (!lastDots || lastDots.length !== dmd.buf.length || dmd.buf.some((v, i) => v !== lastDots[i]) || dmdCanvas.width !== lastDmdW) {
    paintDMD(dmdCtx, dmd, dmdCanvas.width, dmdCanvas.height);
    lastDots = dmd.buf.slice(); lastDmdW = dmdCanvas.width;
  }
  // side panel: touch the DOM only when a value changes
  const p = G.player;
  const chip = dmd.cur ? fmt(p.score) : !touchChip() ? '' : G.mode ? `${G.mode.id.toUpperCase()} ${G.mode.progress | 0}/${G.mode.need} · ${Math.max(0, Math.ceil(G.mode.end - G.t))}s` : `Modes ${G.f.modesPlayed.reduce((a, b) => a + b, 0)}/6 · Tower ${G.f.towerLevel}/3`;
  setText('#score', demo ? '' : chip);
  setText('#ballno', demo ? 'Demo' : G.scene === 'over' ? 'Game over' : 'Ball ' + p.ball + ' of ' + p.ballsPerGame);
  setText('#modeline', demo ? '' : G.mode ? `${G.mode.id === 'raid' ? 'Raid! 1967' : G.mode.id[0].toUpperCase() + G.mode.id.slice(1)} · ${G.mode.progress | 0}/${G.mode.need} · ${Math.max(0, Math.ceil(G.mode.end - G.t))}s` : G.mb ? { arlington: 'Arlington Multiball', soak: 'Grand Soak', valley: 'Valley of the Vapors' }[G.mb.kind] : `Modes ${G.f.modesPlayed.reduce((a, b) => a + b, 0)}/6 · Tower ${G.f.towerLevel}/3`);   // fact: raid
  const showLaunch = !demo && !paused && G.w.balls.some((b) => !b.held && b.x > 480 && b.y < 150);
  const mg = demo ? '' : G.f.modesPlayed.map((p, i) => ((G.mode && G.mode.i === i) || (G.mb && G.mb.kind === 'valley') ? 'on' : G.f.modesWon[i] ? 'won' : p ? 'played' : '')).join(',');
  if (mg !== uiCache.mg) { uiCache.mg = mg; const cls = mg.split(','); document.querySelectorAll('#modegrid li').forEach((li, i) => { li.className = cls[i] || ''; }); }
  if (showLaunch !== uiCache.launch) { $('#b-launch').classList.toggle('ready', showLaunch); uiCache.launch = showLaunch; }
  const pw = (G.w.plunger.pull / G.w.plunger.maxPull).toFixed(2);
  if (pw !== uiCache.power) { $('#power').style.setProperty('--p', pw); uiCache.power = pw; }
}

// ------------------------------------------------------------------------------------------------- hooks
window.__game = {
  paused: false,
  seed(n) { G.rng = createGame(T, { seed: n }).rng; G.seedValue = n; return n; },
  getState() {
    const s = gameState(G);
    s.paused = paused || this.paused; s.demo = demo; s.view = view ? view.kind : null; s.tier = view && view.tier ? view.tier : null;
    s.lamps = lampStates(G, LAMPS, now()); s.dmd = { text: dmd.cur ? dmd.cur.text : null, sub: dmd.cur ? dmd.cur.sub : null, queue: dmd.queue.map((q) => q.text) };
    s.screen = screens.current; s.settings = { ...app.settings }; s.reduced = reducedMotion(); s.timeScale = timeScale; s.scores = loadScores(); s.frame = frameNo;
    s.audio = { ctx: !!audio.ctx, played: [...audio.played] };
    return s;
  },
  setState(s) { setGameState(G, s); return true; },
  isIdle() { return !loading && (!view || !view.busy || !view.busy()); },
  step(n = 1) { for (let i = 0; i < n; i++) { capturePrev(); if (bot) bot(); tick(G); routeCues(); } render(1); return G.w.tick; },
  pause() { this.paused = true; return true; },
  resume() { this.paused = false; lastNow = performance.now(); return true; },
  scene(name) {
    if (name === 'title') { screens.title(); startDemo(); }
    else if (name === 'game') { app.start(); }
    else if (name === 'settings') screens.settings('title');
    else if (name === 'help') screens.help('title');
    else if (name === 'scores') screens.scores('title');
    else if (name === 'pause') { if (demo) app.start(); pause(); }
    else if (name === 'over') { if (demo) app.start(); api.endMode(G, false); G.scene = 'over'; screens.over(G.player.score, 0, false); }
    return screens.current || G.scene;
  },
  newGame(o = {}) { if (o.balls) app.settings.balls = o.balls; app.start(); if (o.seed != null) { G = createGame(T, { seed: o.seed }); newGame(G, { balls: o.balls || 3, practice: !!o.practice, seed: o.seed }); dmd.queue.length = 0; dmd.cur = null; } return true; },
  act(name, ...a) {
    const w = G.w;
    switch (name) {
      case 'flip': flipper(G, a[0], a[1] !== false); return true;
      case 'flipAt': { const t0 = w.tick * TICK; flipper(G, a[0], true, t0 + a[1] / 1000); flipper(G, a[0], false, t0 + (a[1] + (a[2] || 250)) / 1000); return true; }
      case 'plunge': autoPlunge(w, a[0] ?? 0.85); return true;
      case 'nudge': nudge(G, a[0] || 'up'); return true;
      case 'placeBall': { const b = w.balls.find((q) => !q.held) || addBall(w, 0, 0); Object.assign(b, { x: a[0], y: a[1], px: a[0], py: a[1], vx: a[2] || 0, vy: a[3] || 0, layer: a[4] || LAYER.FIELD, held: null }); G.ball.inLane = false; return b.id; }
      case 'addBall': return addBall(w, a[0], a[1], a[2] || 0, a[3] || 0).id;
      case 'clearBalls': for (const b of [...w.balls]) removeBall(w, b); return true;
      case 'clock': renderClock = a[0] == null ? null : a[0] / 1000; return true;
      case 'tier': app.applySettings({ tier: a[0] }); return view ? view.kind + ':' + (view.tier || '') : null;
      case 'mode': api.startMode(G, a[0]); return G.mode && G.mode.id;
      case 'award': return mystery(G, a[0]);
      case 'lamps': G.lampShow = { name: a[0], until: G.t + (a[1] || 3) }; return true;
      case 'camera': if (view && view.setCamera) view.setCamera(a[0]); return true;
      case 'lampLevel': return view && view.lampLevel ? view.lampLevel(a[0]) : null;
      case 'switch': { const id = G.T.sw[a[0]]; G.w.events.push({ t: a[1] || 'hit', sw: id, speed: 1000, dir: 1, ball: (w.balls[0] || {}).id }); return id; }
      case 'multiball': (api[{ arlington: 'startArlington', soak: 'startGrandSoak', valley: 'startValley' }[a[0]]])(G); return true;
      case 'demo': if (a[0]) { screens.close(); startDemo(); } return demo;
    }
    return false;
  },
};

// ------------------------------------------------------------------------------------------------- boot
(async function boot() {
  try {
    clockBase = performance.now();
    document.documentElement.style.setProperty('--text-scale', app.settings.textScale);
    document.body.classList.toggle('reduced', reducedMotion());
    setVolumes({ sound: app.settings.sound, music: app.settings.music, volume: app.settings.volume });
    const packs = typeof PB_ASSETS !== 'undefined' ? PB_ASSETS : [];
    await Promise.all(packs.map((f) => loadScript('assets/' + f)));
    if (window.__PB_ART && window.__PB_ART.backglass) $('.glass-art').style.backgroundImage = `url(${window.__PB_ART.backglass})`;
    try { dmd.art = makeSilhouettes(); } catch { /* optional */ }
    await initView();
    startDemo();
    screens.title();
    loading = false;
    window.__bootMs = Math.round(performance.now());
    lastNow = performance.now();
    requestAnimationFrame(frame);
  } catch (e) {
    const b = $('#boot-error'); b.hidden = false; b.textContent = 'Spa City Pinball could not start: ' + e.message;
    throw e;
  }
})();

return {  };
})();
</script>
</body>
</html>
