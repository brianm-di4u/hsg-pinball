<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Spa City Pinball: an original pinball table on Bathhouse Row in Hot Springs, Arkansas. Open source (MIT).">
  <title>Spa City Pinball</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-scene="boot">
  <div id="stage" class="stage">
    <aside id="glass" class="glass" aria-hidden="true">
      <div class="glass-art"></div>
      <div class="glass-title"><span class="t-small">Spa City</span><span class="t-big">Pinball</span></div>
    </aside>
    <main id="table" class="table" tabindex="-1" aria-label="Pinball table">
      <canvas id="c2d" aria-hidden="true"></canvas>
      <canvas id="gl" aria-label="Spa City pinball table"></canvas>
    </main>
    <aside id="side" class="side">
      <div class="dmd-frame"><canvas id="dmd" aria-hidden="true"></canvas></div>
      <div class="info">
        <div class="score-line"><span id="ballno" class="ballno">Demo</span><span id="score" class="score"></span></div>
        <div id="modeline" class="mode-line" aria-live="off"></div>
        <ol id="modegrid" class="mode-grid" aria-label="Modes"><li>Soak</li><li>Derby</li><li>Raid</li><li>Tower</li><li>Tubs</li><li>Coaster</li></ol>
        <div class="controls-hint">
          <span><kbd>Shift</kbd>/<kbd>Z</kbd> <kbd>/</kbd> flippers</span>
          <span>hold <kbd>Space</kbd> plunge</span>
          <span><kbd>X</kbd> <kbd>.</kbd> <kbd>↑</kbd> nudge · <kbd>Esc</kbd> pause</span>
        </div>
      </div>
      <div class="buttons">
        <button type="button" id="b-menu" class="btn icon" aria-label="Menu">☰<span class="lbl">Menu</span></button>
        <button type="button" id="b-launch" class="btn launch" aria-label="Launch: hold to pull the plunger, release to fire"><span id="power" class="power"></span><span class="lbl">Launch</span></button>
      </div>
    </aside>
  </div>
  <div id="screens" class="screens" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <p id="boot-error" class="boot-error" role="alert" hidden></p>
  <noscript><p class="boot-error">Spa City Pinball needs JavaScript.</p></noscript>
  <!-- @inline ../data/assets.json as PB_ASSETS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
